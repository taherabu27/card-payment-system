<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="overflow-x-auto">
        <table class="min-w-full bg-white mt-6">
          <thead>
            <tr>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Card Number</th>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Name of Card Holder</th>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Amount Paid</th>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Account Number</th>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Payment Type</th>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Contact Number</th>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Deposited Account Number</th>
              <th class="border-solid border-2 border-slate-500 px-4 m-2">Transaction Branch</th>
    
            </tr>
    
          </thead>
    
          <tbody id="payment-information">
            <!-- Payment Information will be appended here by JavaScript -->
    
          </tbody>
        </table>
      </div>
      <script src="script.js"></script>
</body>
</html>
