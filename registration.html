<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Registration Form Container -->
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-semibold text-center mb-6 text-gray-800">Create Account</h2>

        <!-- Registration Form -->
        <form id="registration-form" action="#" method="POST">
            <!-- Name Field -->
            <div class="mb-4">
                <label for="name" class="block text-gray-700 font-semibold mb-2">Full Name</label>
                <input type="text" id="name" name="name"
                    class="w-full px-4 py-2 border rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="Name of the Employee" required>
            </div>

            <!-- Email Field -->
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email Address</label>
                <input type="email" id="email" name="email"
                    class="w-full px-4 py-2 border rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="Employee Official Email ID" required>
            </div>
            <!-- Registration ID Details Field -->
            <div class="mb-4">
                <label  class="block text-gray-700 font-semibold mb-2">Registration ID</label>
                <input type="text" id="office-id" name="id"
                    class="w-full px-4 py-2 border rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="Enter Employee ID as registration ID" required>
            </div>
            <!-- Branch Detaisl -->
            <div class="mb-4">
                <label for="branch" class="block text-gray-700 font-semibold mb-2">Branch Name</label>
                <input type="text" id="branch-name" name="branch name"
                    class="w-full px-4 py-2 border rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="Branch Name" required>
            </div>
            <div class="mb-4">
                <label for="code" class="block text-gray-700 font-semibold mb-2">Branch Code</label>
                <input type="text" id="branch-code" name="code"
                    class="w-full px-4 py-2 border rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="Branch Code" required>
            </div>
            <!-- Password Field -->
            <div class="mb-4">
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" name="password"
                    class="w-full px-4 py-2 border rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="******" required>
            </div>

            <!-- Confirm Password Field -->
            <div class="mb-6">
                <label for="confirm-password" class="block text-gray-700 font-semibold mb-2">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password"
                    class="w-full px-4 py-2 border rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="******" required>
            </div>

            <!-- Submit Button -->
            <div class="flex items-center justify-between">
                <button id= "registration" type="submit"
                    class="w-full py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    Register
                </button>
            </div>
        </form>

        <!-- Login Link -->
        <div class="mt-4 text-center">
            <p class="text-sm text-gray-600">Already have an account? <a href="#"
                    class="text-blue-500 hover:underline">Login</a></p>
        </div>
        <div class="success" id="resultMessage"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
