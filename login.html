<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <div>
            <h2 class="text-xl font-semibold text-center mb-6 text-gray-500">Login With your Registered Email Address
            </h2>
            <form action="" method="POST">
                <div class="mb-4">
                    <label for="name" class="block text-center text-gray-700 font-semibold mb-2">Email Address</label>
                    <input type="text" id="name" name="name"
                        class="w-full px-4 py-2 border rounded-md text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-blue-400"
                        placeholder="Enter Registered Email" required>

                </div>
                <div>
                    <label for="name" class="block text-center text-gray-700 font-semibold mb-2">Password</label>
                    <input type="password" id="password" name="password"
                        class="w-full px-4 py-2 border rounded-md text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-blue-400"
                        placeholder="Enter Valid Password" required>
                </div>
                 <!-- Submit Button -->
            <div class="flex items-center justify-between">
                <button type="submit"
                    class="w-full py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    sign in
                </button>
            </div>
            </form>
        </div>
    </div>
</body>

</html>
